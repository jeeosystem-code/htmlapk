name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          set -e
          ZIP=$(ls *.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then echo "No .zip found in repo root"; exit 1; fi
          mkdir -p project
          unzip -q -o "$ZIP" -d project
          SETTINGS=$(find project -maxdepth 3 -name settings.gradle | head -n1)
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create signing key
        run: |
          cd "$PROJECT_DIR"
          mkdir -p app/src/main/assets
          openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 36500 -subj "/CN=HtmlAppBuilder"
          openssl pkcs8 -topk8 -nocrypt -in key.pem -outform DER -out app/src/main/assets/signing.pk8
          openssl x509 -in cert.pem -outform DER -out app/src/main/assets/signing.der

      - name: Build template app
        run: |
          cd "$PROJECT_DIR"
          gradle :template:assembleRelease --no-daemon --stacktrace

      - name: Embed template into builder
        run: |
          cd "$PROJECT_DIR"
          cp template/build/outputs/apk/release/*.apk app/src/main/assets/template.apk

      - name: Build builder app
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: HtmlAppBuilder-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          
